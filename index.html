<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>SERVED — Your next food post, served.</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f0e3;--card:#fffaf1;--ink:#2c211a;--mut:#7a6a5d;--pri:#c8553d;--pri-ink:#fff;--acc:#f2c94c;--sage:#a3b18a;--line:#e8d9c2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[data-theme=tomato]{--bg:#fbeee6;--card:#fff8f3;--pri:#e0402a;--acc:#f7b7a3;--sage:#d9c9bc;--line:#efd5c8}
[data-theme=butter]{--bg:#fbf1c9;--card:#fffbe6;--ink:#4a3320;--pri:#8a5a2b;--acc:#f2cf4c;--sage:#d8c890;--line:#ecdc9c}
[data-theme=sage]{--bg:#e9eedd;--card:#f6f8ef;--pri:#c8553d;--acc:#8fa877;--sage:#8fa877;--line:#d3dcc0}
[data-theme=night]{--bg:#221d1a;--card:#2e2723;--ink:#f6ead6;--mut:#b5a594;--pri:#e0704f;--acc:#e6c15a;--sage:#8b9a74;--line:#433a33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;min-height:100%}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;letter-spacing:-.02em;margin:0}
button,input,textarea{font:inherit;color:inherit}
#top{display:flex;align-items:center;gap:8px;padding:14px 20px;max-width:1000px;margin:auto}
.logo{height:52px;width:auto;cursor:pointer;margin-right:auto}.hero img{height:clamp(150px,34vw,240px);width:auto;display:block}.sr{position:absolute;left:-9999px}.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);cursor:pointer;flex:none;padding:0}.dot.on{border-color:var(--ink);transform:scale(1.2)}.fa{max-width:100%;height:auto}#top{flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:99px;text-decoration:none;color:var(--ink);font-weight:500;font-size:14px;cursor:pointer}
.nav a.on{background:var(--ink);color:var(--bg)}.nav a.p{color:var(--pri);font-weight:600}
main{max-width:1000px;margin:auto;padding:8px 20px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 2px 10px #0000000d;margin-bottom:16px}
.btn{background:var(--pri);color:var(--pri-ink);border:0;border-radius:99px;padding:14px 24px;font-weight:600;cursor:pointer;min-height:48px}
.btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.s{padding:8px 16px;min-height:36px;font-size:14px}
.btn:disabled{opacity:.5}
.hero{padding:30px 0 10px}.hero h1{font-size:clamp(54px,14vw,110px);font-weight:800;color:var(--pri);line-height:.95}
.hero h2{font-size:clamp(22px,5vw,34px);font-weight:600;margin:6px 0}
.big{background:var(--pri);color:var(--pri-ink);border:0;text-align:left;cursor:pointer;display:block;width:100%;padding:28px;border-radius:26px;margin-bottom:14px}
.big h3{font-size:30px}.big p{margin:6px 0 0;opacity:.9}
.sec{cursor:pointer;display:block;width:100%;text-align:left;background:var(--card);border:1.5px dashed var(--sage);border-radius:20px;padding:16px 20px}
.sec h3{font-size:19px}.sec p{margin:4px 0 0;color:var(--mut);font-size:14px}
label,.lab{display:block;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
input[type=text],input[type=number],textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:0}
textarea{min-height:84px;resize:vertical}input:focus,textarea:focus{border-color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:8px 14px;cursor:pointer;font-size:14px;min-height:38px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#2c211a;font-weight:600}
.tag{display:inline-flex;gap:6px;background:var(--sage);color:#2c211a;border-radius:99px;padding:5px 12px;font-size:14px;margin:0 6px 6px 0}
.tag b{cursor:pointer}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--pri);font-weight:600}
.sect{margin-top:18px}.sect h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.hook{font-family:Fraunces,Georgia,serif;font-size:22px;background:var(--acc);color:#2c211a;border-radius:16px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:14px}.err{background:#c8553d22;border-radius:14px;padding:14px;margin:12px 0}
.load{text-align:center;padding:60px 0}.dot{width:14px;height:14px;background:var(--pri);border-radius:50%;margin:0 auto 16px;animation:p .8s infinite alternate}
@keyframes p{to{transform:scale(1.8);opacity:.4}}
.step{display:flex;gap:10px;margin:6px 0}.step b{color:var(--pri);min-width:70px}
ul.l{margin:0;padding-left:20px}
.msgs{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.m{padding:12px 16px;border-radius:18px;max-width:88%;white-space:pre-wrap}.m.u{background:var(--pri);color:var(--pri-ink);align-self:flex-end}.m.a{background:var(--card);border:1px solid var(--line)}
.sw{width:52px;height:52px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw.on{border-color:var(--ink)}
#bar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
#bar a{flex:1;text-align:center;font-size:11px;padding:6px 2px;color:var(--mut);text-decoration:none;cursor:pointer}#bar a.on{color:var(--pri);font-weight:600}#bar span{display:block;font-size:20px}
@media(max-width:720px){.nav{display:none}#bar{display:flex}}
</style></head><body>

  $('#nav').innerHTML=NAV.map(n=>`<a class="${n[0]==r?'on':''} ${n[0]=='create'?'p':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('');
  $('#bar').innerHTML=NAV.map(n=>`<a class="${n[0]==r?'on':''}" onclick="go('${n[0]}')"><span>${n[2]}</span>${n[1].replace('What Can I Cook?','Cook').replace('Create Content','Create').replace('My Ideas','Ideas')}</a>`).join('');
  ({home,create,cook,ideas,chat,settings}[r]||home)();scrollTo(0,0)}
addEventListener('hashchange',route);
const chips=(k,opts,multi)=>`<div class="chips">${opts.map(o=>{const on=multi?F[k].includes(o):F[k]===o;return `<button class="chip ${on?'on':''}" onclick="pick('${k}','${o.replace(/'/g,"\\'")}',${!!multi})">${o}</button>`}).join('')}</div>`;
function pick(k,v,multi){F.text=$('#ft')?.value??F.text;F.budget=$('#fb')?.value??F.budget;
  if(multi)F[k]=F[k].includes(v)?F[k].filter(x=>x!=v):[...F[k],v];else F[k]=F[k]===v?'':v;create(true)}
function loading(msgs){$('#app').innerHTML=`<div class="load"><div class="dot"></div><h3 id="lm">${msgs[0]}</h3></div>`;let i=0;clearInterval(window.lt);window.lt=setInterval(()=>{const e=$('#lm');if(e)e.textContent=msgs[++i%msgs.length]},1600)}
async function run(msgs,fn,back){lastRun={msgs,fn,back};loading(msgs);try{await fn()}catch(e){console.error(e);clearInterval(window.lt);
  $('#app').innerHTML=`<div class="card"><h3>That didn't come out right.</h3><div class="err">${e&&e.code=='not_granted'?"SERVED needs permission to use Claude for ideas. Allow it when prompted, then try again.":e&&e.code=='rate_limited'?"We're getting a lot of requests. Give it a moment and retry.":"We couldn't cook up your idea just now. Nothing was made up or saved — please try again."}</div><div class="row"><button class="btn" onclick="run(lastRun.msgs,lastRun.fn,lastRun.back)">Retry</button><button class="btn g" onclick="go('${back||'home'}');route()">Back</button></div></div>`}finally{clearInterval(window.lt)}}

/* CREATE */
function create(keep){
 $('#app').innerHTML=`<h2 style="font-size:36px">Create content</h2><p class="mut">Say it casually — "chicken pasta", "R100 grocery challenge", "reviewing a new café".</p>
 <div class="card"><label>What are you working with?</label><textarea id="ft" placeholder="Chicken pasta…">${esc(F.text)}</textarea>
 <div class="chips" style="margin-top:8px">${['Chicken pasta','Homemade pizza','A new restaurant',"My gran's recipe",'R100 grocery challenge','Leftovers'].map(x=>`<button class="chip" onclick="$('#ft').value='${x.replace(/'/g,"\\'")}'">${x}</button>`).join('')}</div>
 <label>Content type</label>${chips('type',TYPES)}<label>Vibe</label>${chips('vibe',VIBES)}<label>Platform</label>${chips('plat',PLATS)}
 <label>Resources</label>${chips('res',RES,1)}<label>Budget (optional, R)</label><input id="fb" type="number" placeholder="e.g. 100" value="${esc(F.budget)}" style="max-width:180px">
 <div class="row" style="margin-top:22px"><button class="btn" onclick="serve()">SERVE MY IDEA ✦</button><button class="btn g" onclick="flip()">CONTENT FLIP ↻</button></div>
 <p class="mut">Content Flip shows the same food as 8 totally different videos.</p></div>`}
function brief(){F.text=$('#ft')?.value??F.text;F.budget=$('#fb')?.value??F.budget;
 return `Food/idea: ${F.text||'(nothing specified — pick something useful and everyday for a beginner)'}\nContent type: ${F.type||'any'}\nVibe: ${F.vibe||'any'}\nPlatform: ${F.plat}\nResources: ${F.res.join(', ')||'just a phone'}\nBudget: ${F.budget?'R'+F.budget:'unspecified'}`}
const RES_SCHEMA=`Return ONLY JSON: {"title":"catchy video title","concept":"the actual video idea, 3-4 sentences","why":"why people would watch (curiosity/tension/payoff)","hook":"strong opening line or visual","structure":[{"t":"0–3 sec","d":"..."}],"shots":["phone-friendly shot",...8-10],"caption":"platform-appropriate caption with hashtags","cta":"natural CTA","series":"how this becomes a recurring series"}`;
function serve(extra){const b=brief();run(['SERVING YOUR IDEA...','FINDING THE ANGLE...'],async()=>{
 const r=await AI(SYS+`Create ONE strong food content concept.\n${b}\n${extra||''}\nAvoid generic ideas; give a specific hook, curiosity gap, action and payoff; structure must have 5 timed steps. `+RES_SCHEMA);
 showResult(r,true)},'create')}
function flip(){const b=brief();run(['FLIPPING THE ANGLE...','FINDING THE ANGLE...'],async()=>{
 const r=await AI(SYS+`Content Flip: turn the same food into 8 DIFFERENT content concepts, one each for these angles: Budget, Experiment, Comedy, Story, Challenge, Aesthetic, Culture (culturally relevant, non-stereotyped), Curiosity (question-driven). Each must feel distinct and not a rewording.\n${b}\nReturn ONLY JSON: {"concepts":[{"angle":"Budget","title":"video title","pitch":"one or two sentences"}]}`);
 $('#app').innerHTML=`<h2 style="font-size:36px">Content flip</h2><p class="mut">Same food, eight videos. Pick one to develop.</p><div class="grid">${r.concepts.map((c,i)=>`<div class="card"><div class="eyebrow">${esc(c.angle)}</div><h3 style="margin:6px 0">${esc(c.title)}</h3><p class="mut">${esc(c.pitch)}</p><button class="btn s" onclick="develop(${i})">DEVELOP THIS</button></div>`).join('')}</div><button class="btn g" onclick="create()">← Edit brief</button>`;window.flipped=r.concepts},'create')}
function develop(i){const c=window.flipped[i];serve(`Develop this specific concept fully — angle: ${c.angle}; title: "${c.title}"; pitch: ${c.pitch}`)}
function showResult(r,fresh){cur=r;if(fresh){S.recent.unshift({type:'content',title:r.title,data:r});S.recent=S.recent.slice(0,12);save()}
 const L=a=>`<ul class="l">${(a||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
 $('#app').innerHTML=`<div class="eyebrow">YOUR IDEA HAS BEEN SERVED</div><h2 style="font-size:clamp(28px,6vw,42px);margin:6px 0 16px">${esc(r.title)}</h2>
 <div class="card"><div class="hook">“${esc(r.hook)}”</div>
 <div class="sect"><h4>Content concept</h4>${esc(r.concept)}</div><div class="sect"><h4>Why people would watch</h4>${esc(r.why)}</div>
 <div class="sect"><h4>Video structure</h4>${(r.structure||[]).map(s=>`<div class="step"><b>${esc(s.t)}</b><span>${esc(s.d)}</span></div>`).join('')}</div>
 <div class="sect"><h4>Shot list</h4>${L(r.shots)}</div><div class="sect"><h4>Caption</h4>${esc(r.caption)}</div><div class="sect"><h4>CTA</h4>${esc(r.cta)}</div><div class="sect"><h4>Series potential</h4>${esc(r.series)}</div></div>
 <div class="row"><button class="btn" onclick="saveIdea('content')">SAVE ★</button><button class="btn g" onclick="copyC()">Copy</button><button class="btn g" onclick="toChat()">Refine in chat</button><button class="btn g" onclick="go('create')">New idea</button></div>`}
function txt(r){return `${r.title}\n\nHook: ${r.hook}\n\nConcept: ${r.concept}\n\nWhy: ${r.why}\n\nStructure:\n${(r.structure||[]).map(s=>s.t+' — '+s.d).join('\n')}\n\nShots:\n${(r.shots||[]).map(s=>'• '+s).join('\n')}\n\nCaption: ${r.caption}\nCTA: ${r.cta}\nSeries: ${r.series}`}
function copyC(){navigator.clipboard?.writeText(txt(cur)).then(()=>alert('Copied'),()=>alert('Copy blocked by browser'))}
function saveIdea(type){const d=type=='recipe'?window.curR:cur;if(S.ideas.some(i=>i.title==(d.title||d.name)&&i.type==type))return alert('Already saved');S.ideas.unshift({id:uid(),type,title:d.title||d.name,data:d,ts:Date.now()});save();alert('Saved to My Ideas')}
/* COOK */
function cook(){
 $('#app').innerHTML=`<h2 style="font-size:32px">What can I cook?</h2><p class="mut">Tell us what you have and we'll work from there.</p>
 <div class="card"><label>What do you have?</label><div id="tg">${C.ings.map((x,i)=>`<span class="tag">${esc(x)} <b onclick="C.ings.splice(${i},1);cook()">×</b></span>`).join('')||'<p class="mut" style="margin:0 0 8px"><b>What\'s hiding in your kitchen?</b> Add a few ingredients.</p>'}</div>
 <input id="ci" type="text" placeholder="Type an ingredient, press Enter (or paste a list)">
 <label>I can spend (R)</label><input id="cb" type="number" placeholder="e.g. 100" value="${esc(C.budget)}" style="max-width:180px">
 <label>Servings</label><div class="chips">${['1','2','4','6+'].map(x=>`<button class="chip ${C.serves==x?'on':''}" onclick="C.serves='${x}';cook()">${x}</button>`).join('')}</div>
 <label>Time</label><div class="chips">${['Under 15 minutes','Under 30 minutes','Under 1 hour',"I don't mind"].map(x=>`<button class="chip ${C.time==x?'on':''}" onclick="C.time=\`${x}\`;cook()">${x}</button>`).join('')}</div>
 <label>Mood</label><div class="chips">${MOODS.map(x=>`<button class="chip ${C.mood==x?'on':''}" onclick="C.mood=C.mood=='${x}'?'':'${x}';cook()">${x}</button>`).join('')}</div>
 <div style="margin-top:22px"><button class="btn" onclick="findMeals()">FIND MEALS</button></div></div><div id="rr"></div>`;
 const i=$('#ci');i.onkeydown=e=>{if(e.key=='Enter'||e.key==','){e.preventDefault();addIng()}};i.onblur=addIng;
 if(recipes)showRecipes()}
function addIng(){const i=$('#ci');if(!i||!i.value.trim())return;const cb=$('#cb')?.value;C.budget=cb??C.budget;i.value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean).forEach(s=>C.ings.push(s));cook()}
function findMeals(){const i=$('#ci');if(i&&i.value.trim())i.value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean).forEach(s=>C.ings.push(s));C.budget=$('#cb')?.value??C.budget;
 if(!C.ings.length){cook();return alert('Add at least one ingredient first.')}
 run(['WORKING WITH WHAT YOU\'VE GOT...','BUILDING YOUR RECIPE...'],async()=>{
 const r=await AI(SYS+`Suggest 4 meals reasoning from the ingredients the user already has. Prioritise: 1) ingredients they have 2) minimal extra ingredients 3) budget 4) servings 5) time 6) mood. Never suggest complicated recipes needing many extras beyond their budget. The options must differ (not 4 variations of one dish). Assume basic pantry staples (oil, salt, pepper) are available but list anything else needed.\nHas: ${C.ings.join(', ')}\nBudget: ${C.budget?'R'+C.budget:'not specified'}\nServings: ${C.serves}\nTime: ${C.time}\nMood: ${C.mood||'any'}\nReturn ONLY JSON: {"recipes":[{"name":"","desc":"short","have":["from user's list"],"need":[{"item":"","cost":number in Rand estimate}],"time":"25 minutes","serves":"2","difficulty":"Easy|Medium|Advanced"}]}`);
 recipes=r.recipes;C.ctx={...C};cook()},'cook')}
const extra=r=>(r.need||[]).reduce((a,n)=>a+(+n.cost||0),0);
function budgetBlock(r,extraCost){const b=+C.budget;return b?`<p><b>Budget:</b> R${b}<br><b>Estimated spend:</b> ~R${extraCost}<br><b>Remaining:</b> ~R${b-extraCost}</p>`:`<p><b>Estimated extra spend:</b> ~R${extraCost}</p>`}
function showRecipes(){$('#rr').innerHTML=`<div class="grid">${recipes.map((r,i)=>`<div class="card"><h3>${esc(r.name)}</h3><p class="mut">${esc(r.desc)}</p><div class="sect"><h4>You already have</h4>${esc((r.have||[]).join(', ')||'—')}</div><div class="sect"><h4>You may need</h4>${(r.need||[]).map(n=>`${esc(n.item)} <span class="mut">~R${+n.cost||0}</span>`).join('<br>')||'Nothing extra'}</div><div class="sect">${budgetBlock(r,extra(r))}<span class="mut">Prices are estimates, not live store prices.</span></div><p class="mut">⏱ ${esc(r.time)} · Serves ${esc(r.serves)} · ${esc(r.difficulty)}</p><button class="btn" onclick="viewRecipe(${i})">VIEW RECIPE</button></div>`).join('')}</div>`}
function viewRecipe(i){const r=recipes[i];run(['BUILDING YOUR RECIPE...'],async()=>{
 const f=await AI(SYS+`Write the full recipe for "${r.name}" for ${C.serves} servings using what they have: ${C.ings.join(', ')}. Extra items to buy: ${(r.need||[]).map(n=>n.item).join(', ')||'none'}. Budget: ${C.budget?'R'+C.budget:'unspecified'}. The "cheaper" version must actually rework the recipe (swap proteins/sauces/carbs) and give its own new extra cost.\nReturn ONLY JSON: {"ingredients":[{"item":"","qty":""}],"method":["step",...],"prep":"10 min","cook":"15 min","subs":["realistic substitution given typical SA cupboards"],"cheaper":{"name":"","changes":["..."],"newExtra":number}}`);
 const full={...r,...f,ctx:{ings:[...C.ings],budget:C.budget,serves:C.serves}};showRecipe(full,true)},'cook')}
function showRecipe(r,fresh){window.curR=r;const ctx=r.ctx||{ings:[],budget:'',serves:''};if(fresh){S.recent.unshift({type:'recipe',title:r.name,data:r});S.recent=S.recent.slice(0,12);save()}
 const ex=extra(r),b=+ctx.budget;
 $('#app').innerHTML=`<div class="eyebrow">Recipe</div><h2 style="font-size:clamp(28px,6vw,42px);margin:6px 0 16px">${esc(r.name)}</h2>
 <button class="big" onclick="makeContent()"><h3>MAKE THIS CONTENT ✦</h3><p>Turn this meal into a video idea with hook, shot list and caption.</p></button>
 <div class="card"><p class="mut">⏱ Prep ${esc(r.prep)} · Cook ${esc(r.cook)} · Serves ${esc(r.serves)} · ${esc(r.difficulty)}</p>
 <div class="sect"><h4>You already have</h4>${esc((r.have||[]).join(', '))}</div>
 <div class="sect"><h4>Shopping list</h4>${(r.need||[]).map(n=>`<label style="text-transform:none;letter-spacing:0;font-size:16px;color:var(--ink);margin:6px 0"><input type="checkbox"> ${esc(n.item)} <span class="mut">~R${+n.cost||0}</span></label>`).join('')||'Nothing to buy'}</div>
 <div class="sect"><h4>Estimated budget</h4>Extra spend ~R${ex}${b?` · Budget R${b} · Remaining ~R${b-ex}`:''}<br><span class="mut">Estimates only — not live prices.</span></div>
 <div class="sect"><h4>Ingredients</h4><ul class="l">${(r.ingredients||[]).map(x=>`<li>${esc(x.qty)} ${esc(x.item)}</li>`).join('')}</ul></div>
 <div class="sect"><h4>Method</h4><ol class="l">${(r.method||[]).map(x=>`<li style="margin:6px 0">${esc(x)}</li>`).join('')}</ol></div>
 <div class="sect"><h4>Easy substitutions</h4><ul class="l">${(r.subs||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
 ${r.cheaper?`<div class="sect"><h4>Make it cheaper</h4><b>${esc(r.cheaper.name)}</b> — extra spend ~R${+r.cheaper.newExtra||0}<ul class="l">${(r.cheaper.changes||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div>
 <div class="row"><button class="btn g" onclick="saveIdea('recipe')">SAVE ★</button><button class="btn g" onclick="go('cook')">← Back to meals</button></div>`}
function makeContent(){const r=window.curR,c=r.ctx||{};F={text:`${r.name} made with ${(c.ings||r.have||[]).join(', ')}${extra(r)?' + about R'+extra(r)+' of extras':''}`,type:'Cooking',vibe:F.vibe,plat:F.plat,res:['Phone','Kitchen'],budget:c.budget||''};
 location.hash='create';const b=`Recipe to turn into content: ${r.name} (serves ${r.serves}). Ingredients: ${(r.ingredients||[]).map(x=>x.qty+' '+x.item).join('; ')}. Method summary: ${(r.method||[]).join(' ')}. Extra spend estimate: R${extra(r)}. Make the "with what I already had + R${extra(r)}" story central.`;
 setTimeout(()=>serve(b),50)}
/* IDEAS */
let IQ='',IF='all';
function ideas(){const list=S.ideas.filter(i=>(IF=='all'||i.type==IF)&&(!IQ||JSON.stringify(i.data).toLowerCase().includes(IQ.toLowerCase())));
 const sec=(t,l)=>l.length?`<h3 class="eyebrow" style="margin:22px 0 10px">${t}</h3><div class="grid">${l.map(card).join('')}</div>`:'';
 const card=i=>`<div class="card"><div class="eyebrow">${i.type=='recipe'?'Recipe':'Content idea'}</div><h3 style="margin:6px 0 12px">${esc(i.title)}</h3><div class="row"><button class="btn s" onclick="openIdea('${i.id}')">Open</button><button class="btn s g" onclick="copyIdea('${i.id}')">Copy</button><button class="btn s g" onclick="delIdea('${i.id}')">Delete</button></div></div>`;
 $('#app').innerHTML=`<h2 style="font-size:36px">My ideas</h2>${S.ideas.length?`<div class="row" style="margin:12px 0"><input type="text" id="iq" placeholder="Search…" value="${esc(IQ)}" style="max-width:260px" oninput="IQ=this.value;ideas();$('#iq').focus();$('#iq').setSelectionRange(99,99)">${['all','content','recipe'].map(f=>`<button class="chip ${IF==f?'on':''}" onclick="IF='${f}';ideas()">${f=='all'?'All':f=='content'?'Content ideas':'Recipes'}</button>`).join('')}</div>${sec('CONTENT IDEAS',list.filter(i=>i.type=='content'))}${sec('RECIPES',list.filter(i=>i.type=='recipe'))}${list.length?'':'<p class="mut">No matches.</p>'}`:`<div class="card" style="text-align:center">${foodArt(110)}<h3>Nothing served yet.</h3><p class="mut">Create your first food concept and it will appear here.</p><button class="btn" onclick="go('create')">CREATE SOMETHING</button></div>`}`}
const gi=id=>S.ideas.find(i=>i.id==id);
function openIdea(id){const i=gi(id);i.type=='recipe'?showRecipe(i.data):showResult(i.data)}
function copyIdea(id){const i=gi(id);const t=i.type=='recipe'?`${i.data.name}\n\nIngredients:\n${(i.data.ingredients||[]).map(x=>x.qty+' '+x.item).join('\n')}\n\nMethod:\n${(i.data.method||[]).map((s,n)=>(n+1)+'. '+s).join('\n')}`:txt(i.data);navigator.clipboard?.writeText(t).then(()=>alert('Copied'),()=>alert('Copy blocked'))}
function delIdea(id){if(confirm('Delete this idea?')){S.ideas=S.ideas.filter(i=>i.id!=id);save();ideas()}}
/* CHAT */
const conv=()=>S.convs.find(c=>c.id==S.active);
function newChat(ctx,title){const c={id:uid(),title:title||'New chat',ctx:ctx||'',msgs:[],ts:Date.now()};S.convs.unshift(c);S.active=c.id;save();return c}
function toChat(){newChat('The user is working on this content idea:\n'+txt(cur),cur.title);go('chat');route()}
function chat(){const c=conv();
 $('#app').innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="font-size:32px">Chat</h2><button class="btn s" onclick="newChat();chat()">+ NEW CHAT</button></div>
 ${S.convs.length?`<div class="chips" style="margin:10px 0">${S.convs.slice(0,12).map(x=>`<button class="chip ${x.id==S.active?'on':''}" onclick="S.active='${x.id}';save();chat()">${esc(x.title.slice(0,26))}</button>`).join('')}</div>`:''}
 <div class="card"><div class="msgs" id="ms">${c&&c.msgs.length?c.msgs.map(m=>`<div class="m ${m.role=='user'?'u':'a'}">${esc(m.content)}</div>`).join(''):`<p class="mut">Keep working on an idea. Try:</p><div class="chips">${['Make this funnier','Give me a stronger hook','Make it filmable with only my phone','Give me a more South African angle','Turn this into a series',"I don't have cream. What can I use?"].map(x=>`<button class="chip" onclick="send(\`${x}\`)">${x}</button>`).join('')}</div>`}</div>
 <div class="row" style="flex-wrap:nowrap"><input type="text" id="ci2" placeholder="Ask SERVED…" onkeydown="if(event.key=='Enter')send()"><button class="btn" id="sb" onclick="send()">Send</button></div></div>`;const m=$('#ms');m.lastElementChild?.scrollIntoView?.()}
async function send(t){t=t||$('#ci2').value.trim();if(!t||busy)return;let c=conv()||newChat();if(c.title=='New chat')c.title=t.slice(0,30);
 c.msgs.push({role:'user',content:t});save();chat();busy=true;$('#sb').disabled=true;
 const ms=$('#ms');ms.insertAdjacentHTML('beforeend','<div class="m a" id="live">Thinking…</div>');
 try{if(!sm&&window.claude)sm=await claude.use('sample');if(!sm)throw{};
  const turns=c.msgs.map((m,i)=>({role:m.role,content:i==0?SYS+'Continue helping in chat; be concise and practical.\n'+(c.ctx?'CONTEXT:\n'+c.ctx+'\n\n':'')+'USER: '+m.content:m.content}));
  const r=await sm(turns,{cache:false,onText:({text})=>{const l=$('#live');if(l)l.textContent=text}});
  c.msgs.push({role:'assistant',content:r.text});save()}
 catch(e){c.msgs.pop();save();busy=false;chat();$('#ms').insertAdjacentHTML('beforeend',`<div class="err">Couldn't get a reply just now. Your message wasn't lost — <a href="#" onclick="event.preventDefault();send(\`${t.replace(/[`\\$]/g,'')}\`)">retry</a>.</div>`);return}
 busy=false;chat()}
/* SETTINGS */
function settings(){$('#app').innerHTML=`<h2 style="font-size:36px">Settings</h2>
 <div class="card"><label style="margin-top:0">Theme</label><div class="row">${Object.entries(THEMES).map(([k,v])=>`<div style="text-align:center"><div class="sw ${S.theme==k?'on':''}" style="background:${v}" onclick="setTheme('${k}')"></div><div class="mut" style="font-size:11px">${k=='original'?'SERVED':k.toUpperCase().replace('NIGHT','NIGHT SERVED')}</div></div>`).join('')}</div></div>
 <div class="card"><label style="margin-top:0">Account</label><p class="mut">No sign-in yet — your ideas, chats and theme are saved in this browser on this device.</p>
 <label>Saved data</label><p>${S.ideas.length} saved ideas · ${S.convs.length} conversations</p>
 <button class="btn g" onclick="if(confirm('Clear all saved ideas, chats and preferences on this device?')){localStorage.removeItem('served');S={...D,theme:'original'};recipes=null;route()}">Clear local data</button></div>`}
route();
</script></body></html>
